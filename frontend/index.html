<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Everest — trade smarter, climb higher. Portfolio tracking, paper trading, options and AI insights." />
    <title>Everest — Trade smarter. Climb higher.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong theme. hooks/useTheme.jsx takes over once React mounts.
      (function () {
        try {
          var t = localStorage.getItem('everest_theme');
          document.documentElement.setAttribute(
            'data-theme',
            t === 'light' ? 'light' : 'dark',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
